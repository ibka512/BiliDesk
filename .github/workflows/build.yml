name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build without code signing
        run: >-
          xcodebuild
          -project BiliDesk.xcodeproj
          -scheme BiliDesk
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
